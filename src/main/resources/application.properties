spring.application.name=camel-agentic-rag

server.port=8080
camel.servlet.mapping.context-path =/*

host=0.0.0.0
serviceport=8080
# ==============================
# Logging
# ==============================
logging.level.org.apache.camel=INFO

#daily.report.filepath =file://C:/data/input
daily.report.filepath = file:///Users/akashsurwase/development/data/input
daily.report.errorfilepath = file:///Users/akashsurwase/development/data/error

camel.component.milvus.host=localhost
camel.component.milvus.port=19530
rag.similarity.threshold=0.65

# =====================================================
# LANGCHAIN4J OLLAMA EMBEDDING MODEL
# =====================================================

langchain4j.ollama.embedding-model.base-url=http://localhost:11434
langchain4j.ollama.embedding-model.model-name=nomic-embed-text
langchain4j.ollama.embedding-model.timeout=60s

# =========================================================
# Camel OpenAI Component
# Ollama provides an OpenAI-compatible API
# =========================================================
camel.component.openai.base-url=http://localhost:11434/v1
camel.component.openai.api-key=ollama
camel.component.openai.model=qwen3:8b
ai.model= qwen3:8b

